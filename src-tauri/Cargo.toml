[package]
name = "learnis"
version = "0.2.3"
description = "本地学习计划与计时软件"
authors = ["pinchuan54", "Claude"]
repository = "https://github.com/pinchuan54/Learnis"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# 库名加 `_lib` 后缀，避免在 Windows 上与可执行文件同名冲突
# 参见 https://github.com/rust-lang/cargo/issues/8519
name = "learnis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 本地数据库（内置 SQLite，不依赖系统库）
rusqlite = { version = "0.42.0", features = ["bundled"] }
# 日期时间与时区
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
# 序列化与错误
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# 系统通知（倒计时结束、长时间计时提醒）
tauri-plugin-notification = "2.8.1"
# 用系统默认浏览器打开项目地址
open = "5.4.5"

# Windows：倒计时归零提醒用的常驻、带按钮的系统通知。
# 通知插件底层就是它（版本跟随插件），插件本身不支持这些选项
[target.'cfg(windows)'.dependencies]
notify-rust = { version = "4.19.0", default-features = false }

# 仅桌面端：全局快捷键、单实例、检查更新、开机自启
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"

[dev-dependencies]
# 测试内部测试包的版本号（如 0.1.2+3）与检查更新的比较方式；版本跟随更新插件
semver = "1.0.28"

# 发布包体积优化，参见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
