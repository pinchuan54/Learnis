[package]
name = "learnis"
version = "0.1.0"
description = "本地学习计划与计时软件"
authors = ["pinchuan54", "Claude"]
repository = "https://github.com/pinchuan54/Learnis"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
# 库名加 `_lib` 后缀，避免在 Windows 上与可执行文件同名冲突
# 参见 https://github.com/rust-lang/cargo/issues/8519
name = "learnis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# 发布包体积优化，参见 https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
