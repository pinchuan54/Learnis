<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Learnis 应用图标源文件：修改后运行 `npx tauri icon src-tauri/icons/app-icon.svg` 重新生成各尺寸 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3AA0FF" />
      <stop offset="1" stop-color="#0062E0" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)" />
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#gloss)" />
  <!-- 进度环：底环 + 四分之三的进度 -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="104" />
  <path d="M512 262 A250 250 0 1 1 262 512" fill="none" stroke="#FFFFFF" stroke-width="104" stroke-linecap="round" />
